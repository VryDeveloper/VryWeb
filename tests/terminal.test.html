<!doctype html>
<meta charset="utf-8">
<title>Terminal tests</title>
<!-- Open through a local server (python -m http.server) and read the page or the console. -->
<pre id="out"></pre>
<script type="module">
import { tokenize, commandName, levenshtein, suggest, commonPrefix, shortHash, slug } from '../js/modules/terminal/lib.js';
import { whatsappText, parseMessageFlag } from '../js/modules/terminal/git.js';
import { whatsappURL } from '../js/modules/actions.js';

const results = [];
const eq = (name, got, want) => {
    const ok = JSON.stringify(got) === JSON.stringify(want);
    results.push(`${ok ? 'PASS' : 'FAIL'}  ${name}${ok ? '' : `  got ${JSON.stringify(got)} want ${JSON.stringify(want)}`}`);
};

eq('tokenize words', tokenize('git commit -m hi'), ['git', 'commit', '-m', 'hi']);
eq('tokenize double quotes', tokenize('git commit -m "olá mundo"'), ['git', 'commit', '-m', 'olá mundo']);
eq('tokenize single quotes', tokenize("echo 'a b'"), ['echo', 'a b']);
eq('tokenize unclosed quote', tokenize('git commit -m "sem fim'), ['git', 'commit', '-m', 'sem fim']);
eq('tokenize extra spaces', tokenize('  help   info '), ['help', 'info']);
eq('commandName strips slash and case', commandName('/HELP'), 'help');
eq('commandName empty', commandName(undefined), '');
eq('levenshtein swap', levenshtein('hlep', 'help'), 2);
eq('levenshtein equal', levenshtein('info', 'info'), 0);
eq('suggest typo', suggest('hlep', ['help', 'info', 'resume']), 'help');
eq('suggest nothing close', suggest('xyzzy', ['help', 'info']), null);
eq('commonPrefix', commonPrefix(['linkedin', 'lang', 'ls']), 'l');
eq('commonPrefix single', commonPrefix(['resume']), 'resume');
eq('commonPrefix empty', commonPrefix([]), '');
eq('shortHash stable', shortHash('abc'), shortHash('abc'));
eq('shortHash length', shortHash('qualquer texto').length, 7);
eq('shortHash differs', shortHash('a') !== shortHash('b'), true);
eq('slug accents', slug('Ana Souza Ção'), 'ana-souza-cao');
eq('slug empty', slug('!!!'), 'mensagem');
eq('-m flag', parseMessageFlag(['-m', 'oi tudo bem']), 'oi tudo bem');
eq('--message flag', parseMessageFlag(['--message', 'x']), 'x');
eq('no flag', parseMessageFlag([]), null);
eq('-m without value', parseMessageFlag(['-m']), '');
const msg = { name: 'Ana', company: 'Acme', subject: 'Vaga', message: 'Oi & tchau?', hash: 'abc1234' };
eq('whatsapp text pt', whatsappText(msg, 'pt').split('\n').slice(0, 3), ['Olá, Victor! Vim pelo seu portfólio.', 'Nome: Ana · Empresa: Acme', 'Assunto: Vaga']);
eq('whatsapp text without company', whatsappText({ ...msg, company: '' }, 'en').split('\n')[1], 'Name: Ana');
eq('whatsapp url encodes', decodeURIComponent(whatsappURL('a & b?').split('text=')[1]), 'a & b?');
eq('whatsapp url number', whatsappURL('x').startsWith('https://wa.me/5531996588742?text='), true);

const failed = results.filter(r => r.startsWith('FAIL')).length;
document.getElementById('out').textContent = `${results.join('\n')}\n\n${failed ? `${failed} FAILED` : `all ${results.length} passed`}`;
console[failed ? 'error' : 'log'](document.getElementById('out').textContent);
</script>
